services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"

# Phase 1 runs SQLite in-process. Postgres/Redis are reserved for later queue/scale-out.
